name: Vendor refresh

# Dependabot bumps package.json but cannot refresh the copies in vendor/ that
# the browser actually loads, so every one of its PRs fails the Vendor sync
# check and has to be redone by hand. This does that one step for it.
#
# pull_request_target is what gives the job a token that may push, and it is
# limited to Dependabot's own PRs, which only ever touch the two manifests.
# Install scripts are skipped so a freshly bumped package cannot run code here.
on:
  pull_request_target:
    paths:
      - package.json
      - package-lock.json

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node tools/sync-vendor.mjs
      # git add -A, not commit -a: a bump can introduce a vendor file that does
      # not exist yet, and an untracked one would be left out of the commit
      - name: Commit the refreshed copies
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "vendor/ already matches the bump"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(deps): refresh the vendor copies for this bump'
          git push
      # proves the pushed state is the one the Vendor sync check asks for,
      # since that check does not re-run on a push made with this token
      - run: node tools/sync-vendor.mjs --check
      - name: Fail if the refresh left anything uncommitted
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            git status --short --untracked-files=all
            echo 'the refresh left files behind, so the PR is incomplete'
            exit 1
          fi
